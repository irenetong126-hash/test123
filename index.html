<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>もも旅費</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23D97757'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-family='sans-serif'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: #FBF7F0;
    color: #2B2620;
    min-height: 100vh;
    padding: 20px 16px 90px;
    position: relative;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; color: #9C8A6E; margin-bottom: 4px; }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }
  .error-banner {
    background: #F6E3DC; color: #B5542C; font-size: 12px;
    padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none;
  }

  /* ---- Page switching ---- */
  .page { display: none; }
  .page.active { display: block; }

  /* ---- Home page: summary strip ---- */
  .summary-strip {
    display: flex; gap: 10px; margin-bottom: 18px;
  }
  .summary-box {
    flex: 1; border-radius: 16px; padding: 16px 14px;
  }
  .summary-box.expense-box { background: linear-gradient(160deg, #D97757 0%, #C05A38 100%); }
  .summary-box.income-box { background: linear-gradient(160deg, #F2B69B 0%, #EDA37E 100%); }
  .summary-box-label { font-size: 11px; color: rgba(255,255,255,0.85); margin-bottom: 6px; letter-spacing: 0.02em; }
  .summary-box-amount { font-family: 'Shippori Mincho', serif; font-size: 22px; font-weight: 700; color: #FBF7F0; }

  .remaining-strip {
    background: #FFFEFB; border: 1px solid #EDE5D6; border-radius: 14px;
    padding: 12px 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .remaining-strip-label { font-size: 12px; color: #8A7A63; }
  .remaining-strip-amount { font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 700; color: #2B2620; }

  .timeline-date-row {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
  }
  .timeline-date-sub { font-size: 11px; color: #B0A38C; }
  .timeline-date-sub .sub-expense { color: #D97757; font-weight: 600; }
  .timeline-date-sub .sub-income { color: #EDA37E; font-weight: 600; margin-left: 8px; }

  /* ---- Home page: timeline ---- */
  .timeline-group { margin-bottom: 16px; }
  .timeline-date-label { font-size: 12px; font-weight: 700; color: #8A7A63; margin-bottom: 8px; letter-spacing: 0.02em; }
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-row {
    display: flex; align-items: center; background: #FFFEFB;
    border: 1px solid #EDE5D6; border-radius: 12px; padding: 10px 12px; gap: 10px;
  }
  .entry-icon-wrap {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .entry-mid { flex: 1; min-width: 0; }
  .entry-note { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-size: 11px; color: #B0A38C; margin-top: 1px; }
  .entry-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .entry-amount.income { color: #D9976F; }
  .entry-amount.expense { color: #2B2620; }
  .delete-btn {
    background: none; border: none; padding: 6px; cursor: pointer; flex-shrink: 0;
    display: flex; color: #B0A38C; font-size: 14px;
  }

  .empty-state {
    background: #FFFEFB; border: 1px dashed #E5DDD0; border-radius: 14px;
    padding: 28px 16px; text-align: center; font-size: 13px; color: #B0A38C;
  }

  /* ---- Calendar page ---- */
  .cal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .cal-month-label { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; }
  .cal-total-hint { font-size: 12px; color: #8A7A63; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 20px;
  }
  .cal-weekday {
    text-align: center; font-size: 11px; color: #B0A38C; padding-bottom: 4px;
  }
  .cal-cell {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid #EDE5D6;
    background: #FFFEFB; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    padding: 4px 2px; gap: 2px;
  }
  .cal-cell.empty { border: none; background: none; cursor: default; }
  .cal-cell.selected { border-color: #D97757; background: #D9775714; }
  .cal-cell.today .cal-cell-day { color: #D97757; font-weight: 700; }
  .cal-cell-day { font-size: 12px; color: #5C5240; }
  .cal-cell-amount { font-size: 9px; color: #D97757; font-weight: 600; }
  .cal-day-detail {
    background: #FFFEFB; border: 1px solid #EDE5D6; border-radius: 14px;
    padding: 14px 16px;
  }
  .cal-day-detail-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #EDE5D6;
  }
  .cal-day-detail-title { font-size: 13px; font-weight: 700; color: #5C5240; }
  .cal-day-detail-total { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; color: #D97757; }

  /* ---- Budget page ---- */
  .balance-card {
    background: linear-gradient(160deg, #D97757 0%, #C05A38 100%);
    border-radius: 20px;
    padding: 22px 20px;
    color: #FBF7F0;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(192,90,56,0.22);
  }
  .balance-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .balance-label { font-size: 12px; color: #FBE4D8; letter-spacing: 0.04em; }
  .balance-budget-tag { font-size: 11px; color: #F6C7B0; }
  .balance-amount { font-family: 'Shippori Mincho', serif; font-size: 40px; font-weight: 700; margin-bottom: 14px; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.22); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; background: #FBF7F0; }
  .progress-caption { font-size: 12px; color: #FBE4D8; margin-top: 8px; }
  .daily-hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.22); font-size: 13px; color: #FBF0E8; }
  .overspend-hint { margin-top: 8px; font-size: 12px; color: #FFE2D1; }

  .section { margin-bottom: 20px; }
  .section-title { font-size: 13px; font-weight: 700; color: #5C5240; margin-bottom: 10px; letter-spacing: 0.02em; }
  .section-hint { font-size: 11px; color: #B0A38C; margin-bottom: 10px; margin-top: -6px; }

  .daily-cat-list { display: flex; flex-direction: column; gap: 8px; }
  .daily-cat-card {
    background: #FFFEFB; border: 1px solid #EDE5D6; border-radius: 14px;
    padding: 12px 14px;
  }
  .daily-cat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .daily-cat-icon {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .daily-cat-name { font-size: 13px; font-weight: 500; flex: 1; }
  .daily-cat-remaining { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; }
  .daily-cat-track { height: 5px; background: #F1EBDD; border-radius: 3px; overflow: hidden; }
  .daily-cat-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .daily-cat-caption { font-size: 11px; color: #B0A38C; margin-top: 6px; }
  .daily-cat-overspend { font-size: 11px; color: #B5542C; margin-top: 4px; font-weight: 500; }

  .flat-lines-wrap { margin-bottom: 10px; }
  .flat-line { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; font-size: 13px; color: #5C5240; }
  .flat-line-amount { font-weight: 700; color: #D97757; }

  .free-budget-card {
    background: #FFFEFB; border: 1px solid #EDE5D6; border-radius: 14px;
    padding: 14px 16px;
  }
  .free-budget-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .free-budget-label { font-size: 12px; color: #8A7A63; }
  .free-budget-remaining { font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 700; color: #D97757; }
  .free-budget-track { height: 5px; background: #F1EBDD; border-radius: 3px; overflow: hidden; }
  .free-budget-fill { height: 100%; border-radius: 3px; background: #D97757; transition: width 0.3s ease; }
  .free-budget-caption { font-size: 11px; color: #B0A38C; margin-top: 6px; }

  /* ---- FAB & modal ---- */
  .fab {
    position: fixed; bottom: 88px; right: 20px; width: 56px; height: 56px;
    border-radius: 28px; background: #D97757; border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(217,119,87,0.4); cursor: pointer;
    color: #FBF7F0; font-size: 26px; line-height: 1; z-index: 5;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(43,38,32,0.4);
    display: none; align-items: flex-end; z-index: 20;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #FBF7F0; width: 100%; border-radius: 20px 20px 0 0;
    padding: 18px 20px 28px; max-height: 85vh; overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-title { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; }
  .close-btn {
    background: #F1EBDD; border: none; border-radius: 8px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #8A7A63; font-size: 16px;
  }

  .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-toggle-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid #E5DDD0;
    background: #FFFEFB; color: #8A7A63; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .type-toggle-btn.active-expense { border-color: #D97757; background: #D977571A; color: #D97757; }
  .type-toggle-btn.active-income { border-color: #4A6B5A; background: #4A6B5A1A; color: #4A6B5A; }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; color: #8A7A63; margin-bottom: 6px; }
  .amount-input {
    width: 100%; font-size: 28px; font-family: 'Shippori Mincho', serif; font-weight: 700;
    padding: 10px 14px; border-radius: 12px; border: 1px solid #E5DDD0;
    background: #FFFEFB; color: #2B2620; outline: none;
  }
  .cat-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-picker-btn {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 10px; border: 1.5px solid #E5DDD0; cursor: pointer;
    background: #FFFEFB; color: #8A7A63; font-size: 12px; font-family: inherit;
  }
  .date-select, .note-input {
    width: 100%; font-size: 14px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #E5DDD0; background: #FFFEFB; color: #2B2620;
    outline: none; font-family: inherit;
  }
  .submit-btn {
    width: 100%; background: #D97757; color: #FBF7F0; border: none;
    border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; opacity: 0.4;
  }
  .submit-btn.enabled { opacity: 1; }
  .submit-btn.income-mode { background: #4A6B5A; }
  .loading { text-align: center; color: #8A7A63; font-size: 14px; padding: 60px 0; }

  /* ---- Bottom nav ---- */
  .bottom-nav {
    position: fixed; left: 16px; right: 16px; bottom: 16px; height: 60px;
    background: #FFFEFB; border-radius: 30px;
    box-shadow: 0 4px 20px rgba(43,38,32,0.12);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    z-index: 15;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 88px; height: 44px; border-radius: 22px;
    background: none; border: none; cursor: pointer;
    color: #B0A38C; font-family: inherit; font-size: 11px; font-weight: 600;
    gap: 3px; transition: background 0.2s ease, color 0.2s ease;
  }
  .nav-btn .nav-icon { display: block; }
  .nav-btn.active { color: #FBF7F0; background: #D97757; }
</style>
</head>
<body>

<div id="errorBanner" class="error-banner"></div>
<div id="loading" class="loading">載入中…</div>

<div id="app" style="display:none;">

  <!-- ===== HOME PAGE ===== -->
  <div class="page active" id="pageHome">
    <div class="summary-strip">
      <div class="summary-box expense-box">
        <div class="summary-box-label"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:4px;"><path d="M12 5v14M5 12l7 7 7-7"/></svg>總支出</div>
        <div class="summary-box-amount" id="homeExpenseTotal"></div>
      </div>
      <div class="summary-box income-box">
        <div class="summary-box-label"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:4px;"><path d="M12 19V5M5 12l7-7 7 7"/></svg>總收入</div>
        <div class="summary-box-amount" id="homeIncomeTotal"></div>
      </div>
    </div>
    <div class="remaining-strip">
      <span class="remaining-strip-label">目前剩餘</span>
      <span class="remaining-strip-amount" id="homeRemaining"></span>
    </div>

    <div id="timelineWrap"></div>

    <div id="resetWrap" style="margin-top:18px; text-align:center; display:none;">
      <button onclick="resetAllEntries()" style="background:none; border:none; color:#B0A38C; font-size:12px; text-decoration:underline; cursor:pointer; font-family:inherit;">清空所有紀錄，重新開始</button>
    </div>
  </div>

  <!-- ===== CALENDAR PAGE ===== -->
  <div class="page" id="pageCalendar">
    <div class="cal-header">
      <span class="cal-month-label" id="calMonthLabel"></span>
      <span class="cal-total-hint" id="calMonthTotal"></span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-day-detail">
      <div class="cal-day-detail-header">
        <span class="cal-day-detail-title" id="calDayTitle"></span>
        <span class="cal-day-detail-total" id="calDayTotal"></span>
      </div>
      <div id="calDayEntries"></div>
    </div>
  </div>

  <!-- ===== BUDGET PAGE ===== -->
  <div class="page" id="pageBudget">
    <div class="balance-card">
      <div class="balance-top-row">
        <span class="balance-label">總預算剩餘</span>
        <span class="balance-budget-tag" id="budgetTag"></span>
      </div>
      <div class="balance-amount" id="balanceAmount"></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-caption" id="progressCaption"></div>
      <div class="daily-hint" id="dailyHint" style="display:none;"></div>
      <div class="overspend-hint" id="overspendHint" style="display:none;"></div>
    </div>

    <div class="section">
      <div class="section-title" id="dailySectionTitle">當日預算</div>
      <div class="section-hint">超支的部分會自動從總預算扣</div>
      <div class="daily-cat-list" id="dailyCatList"></div>
    </div>

    <div class="section">
      <div class="flat-lines-wrap" id="flatLines"></div>
      <div class="free-budget-card">
        <div class="free-budget-top">
          <span class="free-budget-label">購物/其他 可用額度</span>
          <span class="free-budget-remaining" id="freeBudgetRemaining"></span>
        </div>
        <div class="free-budget-track"><div class="free-budget-fill" id="freeBudgetFill"></div></div>
        <div class="free-budget-caption" id="freeBudgetCaption"></div>
      </div>
    </div>
  </div>

</div>

<button class="fab" onclick="openForm()" aria-label="新增紀錄">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="bottom-nav">
  <button class="nav-btn active" id="navHomeBtn" onclick="switchPage('home')">
    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>
    <span>主頁</span>
  </button>
  <button class="nav-btn" id="navCalendarBtn" onclick="switchPage('calendar')">
    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    <span>月曆</span>
  </button>
  <button class="nav-btn" id="navBudgetBtn" onclick="switchPage('budget')">
    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
    <span>預算</span>
  </button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeFormIfOverlay(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">新增支出</span>
      <button class="close-btn" onclick="closeForm()" aria-label="關閉"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>

    <div class="type-toggle">
      <button class="type-toggle-btn active-expense" id="toggleExpenseBtn" onclick="setEntryType('expense')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M12 5v14M5 12l7 7 7-7"/></svg>支出</button>
      <button class="type-toggle-btn" id="toggleIncomeBtn" onclick="setEntryType('income')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M12 19V5M5 12l7-7 7 7"/></svg>收入</button>
    </div>

    <div class="form-group">
      <label class="form-label">金額（円）</label>
      <input type="number" inputmode="numeric" id="amountInput" class="amount-input" placeholder="0" oninput="validateForm()" />
    </div>

    <div class="form-group" id="catPickerGroup">
      <label class="form-label">分類</label>
      <div class="cat-picker" id="catPicker"></div>
    </div>

    <div class="form-group">
      <label class="form-label">日期</label>
      <select id="dateSelect" class="date-select"></select>
    </div>

    <div class="form-group">
      <label class="form-label">備註（選填）</label>
      <input type="text" id="noteInput" class="note-input" placeholder="例如：博多拉麵 / 換匯" />
    </div>

    <button class="submit-btn" id="submitBtn" onclick="addEntry()">加入紀錄</button>
  </div>
</div>

<script>
// dailyBudget: 每日固定額度（每天重置），null = 無每日額度（只看總預算/累計）
const CATEGORIES = [
  { key: "food",       label: "餐費",     icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h0a2 2 0 002-2V2M7 2v20M17 2v7a2 2 0 002 2h0a2 2 0 002-2V2M17 13v9"/></svg>', color: "#B5542C", dailyBudget: 1800 },
  { key: "transit",     label: "地鐵交通", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M8 21l1-4M16 21l-1-4"/><circle cx="8" cy="15" r="0.5" fill="currentColor"/><circle cx="16" cy="15" r="0.5" fill="currentColor"/></svg>', color: "#4A6B5A", dailyBudget: 500 },
  { key: "drink",       label: "飲料費",   icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.5 12a2 2 0 01-2 1.8H9.5a2 2 0 01-2-1.8L6 8z"/><path d="M4 8h16M9 8V6a3 3 0 016 0v2"/></svg>', color: "#6B4E8A", dailyBudget: 333 },
  { key: "shinkansen",  label: "新幹線",   icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V8a2 2 0 012-2h12a2 2 0 012 2v7M4 15h16M4 15l-1 4h4l1-2M20 15l1 4h-4l-1-2M8 5V3M16 5V3"/></svg>', color: "#2E4A6B", dailyBudget: null },
  { key: "other",       label: "購物/其他", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg>', color: "#8A6D3B", dailyBudget: null },
];
const INCOME_META = { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>', color: "#EDA37E", label: "收入" };

const TOTAL_BUDGET = 30000;
const START_DATE = "2026-08-09";
const END_DATE = "2026-08-14";
const SHINKANSEN_PLANNED = 6560;

let entries = []; // { id, type: 'expense'|'income', amount, category (expense only), date, note }
let selectedCategory = "food";
let selectedType = "expense";
let currentPage = "home";

function formatYen(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
}

function dayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["日","一","二","三","四","五","六"];
  return (d.getMonth()+1) + "/" + d.getDate() + "（" + days[d.getDay()] + "）";
}

function getDateRange(start, end) {
  const dates = [];
  let cur = new Date(start + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  while (cur <= last) {
    dates.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function showError(msg) {
  const el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.style.display = "block";
}
function clearError() {
  document.getElementById("errorBanner").style.display = "none";
}

async function loadEntries() {
  try {
    const res = await window.storage.get("entries", false);
    if (res && res.value) {
      entries = JSON.parse(res.value);
    }
  } catch (e) {
    // no existing data yet — fine
  }
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

async function persist() {
  try {
    const res = await window.storage.set("entries", JSON.stringify(entries), false);
    if (!res) showError("儲存失敗，請再試一次");
    else clearError();
  } catch (e) {
    showError("儲存失敗，請再試一次");
  }
}

function switchPage(page) {
  currentPage = page;
  document.getElementById("pageHome").classList.toggle("active", page === "home");
  document.getElementById("pageCalendar").classList.toggle("active", page === "calendar");
  document.getElementById("pageBudget").classList.toggle("active", page === "budget");
  document.getElementById("navHomeBtn").classList.toggle("active", page === "home");
  document.getElementById("navCalendarBtn").classList.toggle("active", page === "calendar");
  document.getElementById("navBudgetBtn").classList.toggle("active", page === "budget");
  if (page === "calendar") renderCalendar();
}

function getTargetDateForBudget() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const today = new Date().toISOString().slice(0,10);
  return dateRange.includes(today) ? today : dateRange[0];
}

function computeTotals() {
  const incomeTotal = entries.filter(e => e.type === "income").reduce((s,e) => s + e.amount, 0);
  const expenseEntryTotal = entries.filter(e => e.type === "expense").reduce((s,e) => s + e.amount, 0);

  // 總預算剩餘只算實際記錄過的花費，不預先扣未記錄的新幹線規劃金額
  const expenseTotal = expenseEntryTotal;

  const availableBudget = TOTAL_BUDGET + incomeTotal;
  const remaining = availableBudget - expenseTotal;

  return { incomeTotal, expenseTotal, expenseEntryTotal, availableBudget, remaining };
}

let selectedCalDate = null;

function render() {
  renderHome();
  renderBudget();
  if (currentPage === "calendar") renderCalendar();
}

function renderHome() {
  const t = computeTotals();
  document.getElementById("homeIncomeTotal").textContent = formatYen(t.incomeTotal);
  document.getElementById("homeExpenseTotal").textContent = formatYen(t.expenseEntryTotal);
  document.getElementById("homeRemaining").textContent = formatYen(t.remaining);

  const wrap = document.getElementById("timelineWrap");
  const resetWrap = document.getElementById("resetWrap");
  if (entries.length === 0) {
    wrap.innerHTML = `<div class="empty-state">還沒有紀錄，點右下角「+」開始記帳</div>`;
    resetWrap.style.display = "none";
    return;
  }
  resetWrap.style.display = "block";

  const sorted = [...entries].sort((a,b) => a.date === b.date ? b.id.localeCompare(a.id) : b.date.localeCompare(a.date));
  const groups = {};
  const order = [];
  sorted.forEach(e => {
    if (!groups[e.date]) { groups[e.date] = []; order.push(e.date); }
    groups[e.date].push(e);
  });

  wrap.innerHTML = order.map(date => {
    const dayExpense = groups[date].filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
    const dayIncome = groups[date].filter(e => e.type === "income").reduce((s,e)=>s+e.amount,0);
    const rows = groups[date].map(e => {
      const isIncome = e.type === "income";
      const meta = isIncome ? INCOME_META : (CATEGORIES.find(c => c.key === e.category) || CATEGORIES[CATEGORIES.length-1]);
      return `
        <div class="entry-row">
          <div class="entry-icon-wrap" style="background:${meta.color}1A;">${meta.icon}</div>
          <div class="entry-mid">
            <div class="entry-note">${escapeHtml(e.note || meta.label)}</div>
            <div class="entry-sub">${isIncome ? "收入" : meta.label}</div>
          </div>
          <div class="entry-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatYen(e.amount)}</div>
          <button class="delete-btn" onclick="deleteEntry('${e.id}')" aria-label="刪除紀錄"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
        </div>
      `;
    }).join("");
    return `
      <div class="timeline-group">
        <div class="timeline-date-row">
          <div class="timeline-date-label">${dayLabel(date)}${date === new Date().toISOString().slice(0,10) ? "（今天）" : ""}</div>
          <div class="timeline-date-sub">
            ${dayExpense > 0 ? `<span class="sub-expense">支 ${formatYen(dayExpense)}</span>` : ""}
            ${dayIncome > 0 ? `<span class="sub-income">收 ${formatYen(dayIncome)}</span>` : ""}
          </div>
        </div>
        <div class="entry-list">${rows}</div>
      </div>
    `;
  }).join("");
}

function renderBudget() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const daysTotal = dateRange.length;
  const t = computeTotals();

  document.getElementById("budgetTag").textContent = "總預算 " + formatYen(TOTAL_BUDGET) + (t.incomeTotal > 0 ? " +收入" + formatYen(t.incomeTotal) : "");
  document.getElementById("balanceAmount").textContent = formatYen(t.remaining);
  const pctUsed = Math.min(100, (t.expenseTotal / t.availableBudget) * 100);
  document.getElementById("progressFill").style.width = pctUsed + "%";
  document.getElementById("progressCaption").textContent = "已花 " + formatYen(t.expenseTotal) + " · 用了 " + pctUsed.toFixed(0) + "%";

  const todayStr = new Date().toISOString().slice(0,10);
  const todayIdx = dateRange.indexOf(todayStr);
  const daysElapsed = todayIdx >= 0 ? todayIdx+1 : (todayStr > END_DATE ? daysTotal : 0);
  const daysLeft = Math.max(0, daysTotal - Math.max(daysElapsed,0));
  const dailyHintEl = document.getElementById("dailyHint");
  if (daysLeft > 0) {
    const dailyBudgetLeft = t.remaining / daysLeft;
    dailyHintEl.style.display = "block";
    dailyHintEl.innerHTML = "剩 " + daysLeft + " 天 · 平均每天可花 <b>" + formatYen(dailyBudgetLeft) + "</b>";
  } else if (todayStr > END_DATE) {
    dailyHintEl.style.display = "block";
    dailyHintEl.textContent = "行程已結束";
  } else {
    dailyHintEl.style.display = "none";
  }

  let totalOverspend = 0;
  const dailyCats = CATEGORIES.filter(c => c.dailyBudget !== null);
  dailyCats.forEach(c => {
    dateRange.forEach(d => {
      const spent = entries.filter(e => e.type === "expense" && e.category === c.key && e.date === d).reduce((s,e)=>s+e.amount,0);
      if (spent > c.dailyBudget) totalOverspend += (spent - c.dailyBudget);
    });
  });
  const overspendEl = document.getElementById("overspendHint");
  if (totalOverspend > 0) {
    overspendEl.style.display = "block";
    overspendEl.textContent = "含每日額度累計超支 " + formatYen(totalOverspend) + "（已從總預算扣除）";
  } else {
    overspendEl.style.display = "none";
  }

  const targetDate = getTargetDateForBudget();
  const isToday = targetDate === todayStr;
  document.getElementById("dailySectionTitle").textContent = isToday ? "當日預算（今天）" : dayLabel(targetDate) + " 預算";

  const dailyCatList = document.getElementById("dailyCatList");
  dailyCatList.innerHTML = "";
  dailyCats.forEach(c => {
    const spentToday = entries
      .filter(e => e.type === "expense" && e.category === c.key && e.date === targetDate)
      .reduce((s,e) => s+e.amount, 0);
    const remainingToday = c.dailyBudget - spentToday;
    const pct = Math.min(100, (spentToday / c.dailyBudget) * 100);
    const over = spentToday > c.dailyBudget ? spentToday - c.dailyBudget : 0;

    const card = document.createElement("div");
    card.className = "daily-cat-card";
    card.innerHTML = `
      <div class="daily-cat-top">
        <div class="daily-cat-icon" style="background:${c.color}1A;">${c.icon}</div>
        <div class="daily-cat-name">${c.label}</div>
        <div class="daily-cat-remaining" style="color:${remainingToday < 0 ? '#B5542C' : c.color};">${formatYen(remainingToday)}</div>
      </div>
      <div class="daily-cat-track"><div class="daily-cat-fill" style="width:${pct}%;background:${pct>90?'#B5542C':c.color};"></div></div>
      <div class="daily-cat-caption">每日預算 ${formatYen(c.dailyBudget)} · 已花 ${formatYen(spentToday)}</div>
      ${over > 0 ? `<div class="daily-cat-overspend">超支 ${formatYen(over)}，已從總預算扣除</div>` : ""}
    `;
    dailyCatList.appendChild(card);
  });

  const flatCats = CATEGORIES.filter(c => c.dailyBudget === null && c.key !== "other");
  const flatLinesEl = document.getElementById("flatLines");
  flatLinesEl.innerHTML = flatCats.map(c => {
    const planned = c.key === "shinkansen" ? SHINKANSEN_PLANNED : entries.filter(e => e.type === "expense" && e.category === c.key).reduce((s,e)=>s+e.amount,0);
    return `<div class="flat-line"><span style="display:flex; align-items:center; gap:6px;">${c.icon} ${c.label}</span><span class="flat-line-amount">-${formatYen(planned)}</span></div>`;
  }).join("");

  const necessaryBudget = dailyCats.reduce((s,c) => s + c.dailyBudget * daysTotal, 0) + SHINKANSEN_PLANNED;
  const freeBudgetTotal = t.availableBudget - necessaryBudget;
  const otherSpent = entries.filter(e => e.type === "expense" && e.category === "other").reduce((s,e) => s+e.amount, 0);
  const freeRemaining = freeBudgetTotal - otherSpent;
  const freePct = Math.min(100, (otherSpent / freeBudgetTotal) * 100);

  document.getElementById("freeBudgetRemaining").textContent = formatYen(freeRemaining);
  document.getElementById("freeBudgetRemaining").style.color = freeRemaining < 0 ? "#B5542C" : "#D97757";
  document.getElementById("freeBudgetFill").style.width = Math.max(0, freePct) + "%";
  document.getElementById("freeBudgetFill").style.background = freePct > 90 ? "#B5542C" : "#D97757";
  document.getElementById("freeBudgetCaption").textContent =
    "扣除必要預算（餐費/地鐵/飲料/新幹線共 " + formatYen(necessaryBudget) + "）後可用 " + formatYen(freeBudgetTotal) + " · 已花 " + formatYen(otherSpent);
}

function renderCalendar() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const todayStr = new Date().toISOString().slice(0,10);
  if (!selectedCalDate) {
    selectedCalDate = dateRange.includes(todayStr) ? todayStr : dateRange[0];
  }

  // 月份標籤（用行程開始月份）
  const firstDate = new Date(START_DATE + "T00:00:00");
  document.getElementById("calMonthLabel").textContent = (firstDate.getFullYear()) + "年" + (firstDate.getMonth()+1) + "月";

  const monthExpenseTotal = entries.filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
  document.getElementById("calMonthTotal").textContent = "行程總支出 " + formatYen(monthExpenseTotal);

  // 建立月曆格子：以行程當月完整週為單位排列
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const weekdayLabels = ["日","一","二","三","四","五","六"];
  const gridEl = document.getElementById("calGrid");
  let cellsHtml = weekdayLabels.map(w => `<div class="cal-weekday">${w}</div>`).join("");

  for (let i = 0; i < startWeekday; i++) {
    cellsHtml += `<div class="cal-cell empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const inTrip = dateRange.includes(dateStr);
    const dayExpense = entries.filter(e => e.type === "expense" && e.date === dateStr).reduce((s,e)=>s+e.amount,0);
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalDate;
    const classes = ["cal-cell"];
    if (isToday) classes.push("today");
    if (isSelected) classes.push("selected");
    if (!inTrip) classes.push("empty");

    cellsHtml += `
      <div class="${classes.join(' ')}" ${inTrip ? `onclick="selectCalDate('${dateStr}')"` : ""}>
        <div class="cal-cell-day">${d}</div>
        ${dayExpense > 0 ? `<div class="cal-cell-amount">${formatYen(dayExpense)}</div>` : ""}
      </div>
    `;
  }

  gridEl.innerHTML = cellsHtml;

  // 選中日期的明細
  document.getElementById("calDayTitle").textContent = dayLabel(selectedCalDate);
  const dayEntries = entries.filter(e => e.date === selectedCalDate);
  const dayExpenseTotal = dayEntries.filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
  document.getElementById("calDayTotal").textContent = formatYen(dayExpenseTotal);

  const detailEl = document.getElementById("calDayEntries");
  if (dayEntries.length === 0) {
    detailEl.innerHTML = `<div class="empty-state" style="padding:16px;">這天還沒有紀錄</div>`;
  } else {
    const sorted = [...dayEntries].sort((a,b) => b.id.localeCompare(a.id));
    detailEl.innerHTML = `<div class="entry-list">` + sorted.map(e => {
      const isIncome = e.type === "income";
      const meta = isIncome ? INCOME_META : (CATEGORIES.find(c => c.key === e.category) || CATEGORIES[CATEGORIES.length-1]);
      return `
        <div class="entry-row">
          <div class="entry-icon-wrap" style="background:${meta.color}1A;">${meta.icon}</div>
          <div class="entry-mid">
            <div class="entry-note">${escapeHtml(e.note || meta.label)}</div>
            <div class="entry-sub">${isIncome ? "收入" : meta.label}</div>
          </div>
          <div class="entry-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatYen(e.amount)}</div>
        </div>
      `;
    }).join("") + `</div>`;
  }
}

function selectCalDate(dateStr) {
  selectedCalDate = dateStr;
  renderCalendar();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function openForm() {
  const dateSelect = document.getElementById("dateSelect");
  dateSelect.innerHTML = "";
  getDateRange(START_DATE, END_DATE).forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = dayLabel(d);
    dateSelect.appendChild(opt);
  });

  const today = new Date().toISOString().slice(0,10);
  if (today >= START_DATE && today <= END_DATE) dateSelect.value = today;

  selectedCategory = "food";
  setEntryType("expense");

  document.getElementById("amountInput").value = "";
  document.getElementById("noteInput").value = "";
  validateForm();

  document.getElementById("modalOverlay").classList.add("open");
  setTimeout(() => document.getElementById("amountInput").focus(), 50);
}

function closeForm() {
  document.getElementById("modalOverlay").classList.remove("open");
  render();
}
function closeFormIfOverlay(ev) {
  if (ev.target.id === "modalOverlay") closeForm();
}

function setEntryType(type) {
  selectedType = type;
  const expenseBtn = document.getElementById("toggleExpenseBtn");
  const incomeBtn = document.getElementById("toggleIncomeBtn");
  const catGroup = document.getElementById("catPickerGroup");
  const submitBtn = document.getElementById("submitBtn");
  const modalTitle = document.getElementById("modalTitle");

  if (type === "expense") {
    expenseBtn.classList.add("active-expense");
    incomeBtn.classList.remove("active-income");
    catGroup.style.display = "block";
    submitBtn.classList.remove("income-mode");
    modalTitle.textContent = "新增支出";
    renderCatPicker();
  } else {
    incomeBtn.classList.add("active-income");
    expenseBtn.classList.remove("active-expense");
    catGroup.style.display = "none";
    submitBtn.classList.add("income-mode");
    modalTitle.textContent = "新增收入";
  }
}

function renderCatPicker() {
  const picker = document.getElementById("catPicker");
  picker.innerHTML = "";
  CATEGORIES.forEach(c => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-picker-btn" + (selectedCategory === c.key ? " active" : "");
    btn.style.borderColor = selectedCategory === c.key ? c.color : "#E5DDD0";
    btn.style.background = selectedCategory === c.key ? c.color + "14" : "#FFFEFB";
    btn.style.color = selectedCategory === c.key ? c.color : "#8A7A63";
    btn.innerHTML = `<span>${c.icon}</span><span>${c.label}</span>`;
    btn.onclick = () => { selectedCategory = c.key; renderCatPicker(); };
    picker.appendChild(btn);
  });
}

function validateForm() {
  const amt = parseFloat(document.getElementById("amountInput").value);
  const btn = document.getElementById("submitBtn");
  if (amt && amt > 0) btn.classList.add("enabled");
  else btn.classList.remove("enabled");
}

function addEntry() {
  const amt = parseFloat(document.getElementById("amountInput").value);
  if (!amt || amt <= 0) return;
  const date = document.getElementById("dateSelect").value;
  const note = document.getElementById("noteInput").value.trim();

  const entry = {
    id: "e_" + Date.now(),
    type: selectedType,
    amount: amt,
    date: date,
    note: note,
  };
  if (selectedType === "expense") entry.category = selectedCategory;

  entries.push(entry);

  persist();
  closeForm();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  persist();
  render();
}

async function resetAllEntries() {
  if (!confirm("確定要清空所有紀錄嗎？此動作無法復原。")) return;
  entries = [];
  await persist();
  render();
}

loadEntries();
</script>
