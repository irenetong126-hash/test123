<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: #FBF7F0;
    color: #2B2620;
    min-height: 100vh;
    padding: 20px 16px 90px;
    position: relative;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; color: #9C8A6E; margin-bottom: 4px; }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }
  .error-banner {
    background: #F6E3DC; color: #B5542C; font-size: 12px;
    padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none;
  }

  /* ---- Page switching ---- */
  .page { display: none; }
  .page.active { display: block; }

  /* ---- Home page: summary strip ---- */
  .summary-strip {
    display: flex; gap: 10px; margin-bottom: 18px;
  }
  .summary-box {
    flex: 1; border-radius: 16px; padding: 16px 14px;
  }
  .summary-box.expense-box { background: linear-gradient(160deg, #D97757 0%, #C05A38 100%); }
  .summary-box.income-box { background: linear-gradient(160deg, #F2B69B 0%, #EDA37E 100%); }
  .summary-box-label { font-size: 11px; color: rgba(255,255,255,0.85); margin-bottom: 6px; letter-spacing: 0.02em; }
  .summary-box-amount { font-family: 'Shippori Mincho', serif; font-size: 22px; font-weight: 700; color: #FBF7F0; }

  .remaining-strip {
    background: #FFFEFB; border: 1px solid #EDE5D6; border-radius: 14px;
    padding: 12px 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .remaining-strip-label { font-size: 12px; color: #8A7A63; }
  .remaining-strip-amount { font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 700; color: #2B2620; }

  .timeline-date-row {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
  }
  .timeline-date-sub { font-size: 11px; color: #B0A38C; }
  .timeline-date-sub .sub-expense { color: #D97757; font-weight: 600; }
  .timeline-date-sub .sub-income { color: #EDA37E; font-weight: 600; margin-left: 8px; }

  /* ---- Home page: timeline ---- */
  .timeline-group { margin-bottom: 16px; }
  .timeline-date-label { font-size: 12px; font-weight: 700; color: #8A7A63; margin-bottom: 8px; letter-spacing: 0.02em; }
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-row {
    display: flex; align-items: center; background: #FFFEFB;
    border: 1px solid #EDE5D6; border-radius: 12px; padding: 10px 12px; gap: 10px;
  }
  .entry-icon-wrap {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .entry-mid { flex: 1; min-width: 0; }
  .entry-note { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-size: 11px; color: #B0A38C; margin-top: 1px; }
  .entry-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .entry-amount.income { color: #D9976F; }
  .entry-amount.expense { color: #2B2620; }
  .delete-btn {
    background: none; border: none; padding: 6px; cursor: pointer; flex-shrink: 0;
    display: flex; color: #B0A38C; font-size: 14px;
  }

  .empty-state {
    background: #FFFEFB; border: 1px dashed #E5DDD0; border-radius: 14px;
    padding: 28px 16px; text-align: center; font-size: 13px; color: #B0A38C;
  }

  /* ---- Calendar page ---- */
  .cal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .cal-month-label { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; }
  .cal-total-hint { font-size: 12px; color: #8A7A63; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 20px;
  }
  .cal-weekday {

<body>

<script>
// dailyBudget: 每日固定額度（每天重置），null = 無每日額度（只看總預算/累計）
const CATEGORIES = [
  { key: "food",       label: "餐費",     icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h0a2 2 0 002-2V2M7 2v20M17 2v7a2 2 0 002 2h0a2 2 0 002-2V2M17 13v9"/></svg>', color: "#B5542C", dailyBudget: 1800 },
  { key: "transit",     label: "地鐵交通", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M8 21l1-4M16 21l-1-4"/><circle cx="8" cy="15" r="0.5" fill="currentColor"/><circle cx="16" cy="15" r="0.5" fill="currentColor"/></svg>', color: "#4A6B5A", dailyBudget: 500 },
  { key: "drink",       label: "飲料費",   icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.5 12a2 2 0 01-2 1.8H9.5a2 2 0 01-2-1.8L6 8z"/><path d="M4 8h16M9 8V6a3 3 0 016 0v2"/></svg>', color: "#6B4E8A", dailyBudget: 333 },
  { key: "shinkansen",  label: "新幹線",   icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V8a2 2 0 012-2h12a2 2 0 012 2v7M4 15h16M4 15l-1 4h4l1-2M20 15l1 4h-4l-1-2M8 5V3M16 5V3"/></svg>', color: "#2E4A6B", dailyBudget: null },
  { key: "other",       label: "購物/其他", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg>', color: "#8A6D3B", dailyBudget: null },
];
const INCOME_META = { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>', color: "#EDA37E", label: "收入" };

const TOTAL_BUDGET = 30000;
const START_DATE = "2026-08-09";
const END_DATE = "2026-08-14";
const SHINKANSEN_PLANNED = 6560;

let entries = []; // { id, type: 'expense'|'income', amount, category (expense only), date, note }
let selectedCategory = "food";
let selectedType = "expense";
let currentPage = "home";

function formatYen(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
}

function dayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["日","一","二","三","四","五","六"];
  return (d.getMonth()+1) + "/" + d.getDate() + "（" + days[d.getDay()] + "）";
}

function getDateRange(start, end) {
  const dates = [];
  let cur = new Date(start + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  while (cur <= last) {
    dates.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function showError(msg) {
  const el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.style.display = "block";
}
function clearError() {
  document.getElementById("errorBanner").style.display = "none";
}

async function loadEntries() {
  try {
    const res = await window.storage.get("entries", false);
    if (res && res.value) {
      entries = JSON.parse(res.value);
    }
  } catch (e) {
    // no existing data yet — fine
  }
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

async function persist() {
  try {
    const res = await window.storage.set("entries", JSON.stringify(entries), false);
    if (!res) showError("儲存失敗，請再試一次");
    else clearError();
  } catch (e) {
    showError("儲存失敗，請再試一次");
  }
}

function switchPage(page) {
  currentPage = page;
  document.getElementById("pageHome").classList.toggle("active", page === "home");
  document.getElementById("pageCalendar").classList.toggle("active", page === "calendar");
  document.getElementById("pageBudget").classList.toggle("active", page === "budget");
  document.getElementById("navHomeBtn").classList.toggle("active", page === "home");
  document.getElementById("navCalendarBtn").classList.toggle("active", page === "calendar");
  document.getElementById("navBudgetBtn").classList.toggle("active", page === "budget");
  if (page === "calendar") renderCalendar();
}

function getTargetDateForBudget() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const today = new Date().toISOString().slice(0,10);
  return dateRange.includes(today) ? today : dateRange[0];
}

function computeTotals() {
  const incomeTotal = entries.filter(e => e.type === "income").reduce((s,e) => s + e.amount, 0);
  const expenseEntryTotal = entries.filter(e => e.type === "expense").reduce((s,e) => s + e.amount, 0);

  // 總預算剩餘只算實際記錄過的花費，不預先扣未記錄的新幹線規劃金額
  const expenseTotal = expenseEntryTotal;

  const availableBudget = TOTAL_BUDGET + incomeTotal;
  const remaining = availableBudget - expenseTotal;

  return { incomeTotal, expenseTotal, expenseEntryTotal, availableBudget, remaining };
}

let selectedCalDate = null;

function render() {
  renderHome();
  renderBudget();
  if (currentPage === "calendar") renderCalendar();
}

function renderHome() {
  const t = computeTotals();
  document.getElementById("homeIncomeTotal").textContent = formatYen(t.incomeTotal);
  document.getElementById("homeExpenseTotal").textContent = formatYen(t.expenseEntryTotal);
  document.getElementById("homeRemaining").textContent = formatYen(t.remaining);

  const wrap = document.getElementById("timelineWrap");
  const resetWrap = document.getElementById("resetWrap");
  if (entries.length === 0) {
    wrap.innerHTML = `<div class="empty-state">還沒有紀錄，點右下角「+」開始記帳</div>`;
    resetWrap.style.display = "none";
    return;
  }
  resetWrap.style.display = "block";

  const sorted = [...entries].sort((a,b) => a.date === b.date ? b.id.localeCompare(a.id) : b.date.localeCompare(a.date));
  const groups = {};
  const order = [];
  sorted.forEach(e => {
    if (!groups[e.date]) { groups[e.date] = []; order.push(e.date); }
    groups[e.date].push(e);
  });

  wrap.innerHTML = order.map(date => {
    const dayExpense = groups[date].filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
    const dayIncome = groups[date].filter(e => e.type === "income").reduce((s,e)=>s+e.amount,0);
    const rows = groups[date].map(e => {
      const isIncome = e.type === "income";
      const meta = isIncome ? INCOME_META : (CATEGORIES.find(c => c.key === e.category) || CATEGORIES[CATEGORIES.length-1]);
      return `
        <div class="entry-row">
          <div class="entry-icon-wrap" style="background:${meta.color}1A;">${meta.icon}</div>
          <div class="entry-mid">
            <div class="entry-note">${escapeHtml(e.note || meta.label)}</div>
            <div class="entry-sub">${isIncome ? "收入" : meta.label}</div>
          </div>
          <div class="entry-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatYen(e.amount)}</div>
          <button class="delete-btn" onclick="deleteEntry('${e.id}')" aria-label="刪除紀錄"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
        </div>
      `;
    }).join("");
    return `
      <div class="timeline-group">
        <div class="timeline-date-row">
          <div class="timeline-date-label">${dayLabel(date)}${date === new Date().toISOString().slice(0,10) ? "（今天）" : ""}</div>
          <div class="timeline-date-sub">
            ${dayExpense > 0 ? `<span class="sub-expense">支 ${formatYen(dayExpense)}</span>` : ""}
            ${dayIncome > 0 ? `<span class="sub-income">收 ${formatYen(dayIncome)}</span>` : ""}
          </div>
        </div>
        <div class="entry-list">${rows}</div>
      </div>
    `;
  }).join("");
}

function renderBudget() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const daysTotal = dateRange.length;
  const t = computeTotals();

  document.getElementById("budgetTag").textContent = "總預算 " + formatYen(TOTAL_BUDGET) + (t.incomeTotal > 0 ? " +收入" + formatYen(t.incomeTotal) : "");
  document.getElementById("balanceAmount").textContent = formatYen(t.remaining);
  const pctUsed = Math.min(100, (t.expenseTotal / t.availableBudget) * 100);
  document.getElementById("progressFill").style.width = pctUsed + "%";
  document.getElementById("progressCaption").textContent = "已花 " + formatYen(t.expenseTotal) + " · 用了 " + pctUsed.toFixed(0) + "%";

  const todayStr = new Date().toISOString().slice(0,10);
  const todayIdx = dateRange.indexOf(todayStr);
  const daysElapsed = todayIdx >= 0 ? todayIdx+1 : (todayStr > END_DATE ? daysTotal : 0);
  const daysLeft = Math.max(0, daysTotal - Math.max(daysElapsed,0));
  const dailyHintEl = document.getElementById("dailyHint");
  if (daysLeft > 0) {
    const dailyBudgetLeft = t.remaining / daysLeft;
    dailyHintEl.style.display = "block";
    dailyHintEl.innerHTML = "剩 " + daysLeft + " 天 · 平均每天可花 <b>" + formatYen(dailyBudgetLeft) + "</b>";
  } else if (todayStr > END_DATE) {
    dailyHintEl.style.display = "block";
    dailyHintEl.textContent = "行程已結束";
  } else {
    dailyHintEl.style.display = "none";
  }

  let totalOverspend = 0;
  const dailyCats = CATEGORIES.filter(c => c.dailyBudget !== null);
  dailyCats.forEach(c => {
    dateRange.forEach(d => {
      const spent = entries.filter(e => e.type === "expense" && e.category === c.key && e.date === d).reduce((s,e)=>s+e.amount,0);
      if (spent > c.dailyBudget) totalOverspend += (spent - c.dailyBudget);
    });
  });
  const overspendEl = document.getElementById("overspendHint");
  if (totalOverspend > 0) {
    overspendEl.style.display = "block";
    overspendEl.textContent = "含每日額度累計超支 " + formatYen(totalOverspend) + "（已從總預算扣除）";
  } else {
    overspendEl.style.display = "none";
  }

  const targetDate = getTargetDateForBudget();
  const isToday = targetDate === todayStr;
  document.getElementById("dailySectionTitle").textContent = isToday ? "當日預算（今天）" : dayLabel(targetDate) + " 預算";

  const dailyCatList = document.getElementById("dailyCatList");
  dailyCatList.innerHTML = "";
  dailyCats.forEach(c => {
    const spentToday = entries
      .filter(e => e.type === "expense" && e.category === c.key && e.date === targetDate)
      .reduce((s,e) => s+e.amount, 0);
    const remainingToday = c.dailyBudget - spentToday;
    const pct = Math.min(100, (spentToday / c.dailyBudget) * 100);
    const over = spentToday > c.dailyBudget ? spentToday - c.dailyBudget : 0;

    const card = document.createElement("div");
    card.className = "daily-cat-card";
    card.innerHTML = `
      <div class="daily-cat-top">
        <div class="daily-cat-icon" style="background:${c.color}1A;">${c.icon}</div>
        <div class="daily-cat-name">${c.label}</div>
        <div class="daily-cat-remaining" style="color:${remainingToday < 0 ? '#B5542C' : c.color};">${formatYen(remainingToday)}</div>
      </div>
      <div class="daily-cat-track"><div class="daily-cat-fill" style="width:${pct}%;background:${pct>90?'#B5542C':c.color};"></div></div>
      <div class="daily-cat-caption">每日預算 ${formatYen(c.dailyBudget)} · 已花 ${formatYen(spentToday)}</div>
      ${over > 0 ? `<div class="daily-cat-overspend">超支 ${formatYen(over)}，已從總預算扣除</div>` : ""}
    `;
    dailyCatList.appendChild(card);
  });

  const flatCats = CATEGORIES.filter(c => c.dailyBudget === null && c.key !== "other");
  const flatLinesEl = document.getElementById("flatLines");
  flatLinesEl.innerHTML = flatCats.map(c => {
    const planned = c.key === "shinkansen" ? SHINKANSEN_PLANNED : entries.filter(e => e.type === "expense" && e.category === c.key).reduce((s,e)=>s+e.amount,0);
    return `<div class="flat-line"><span style="display:flex; align-items:center; gap:6px;">${c.icon} ${c.label}</span><span class="flat-line-amount">-${formatYen(planned)}</span></div>`;
  }).join("");

  const necessaryBudget = dailyCats.reduce((s,c) => s + c.dailyBudget * daysTotal, 0) + SHINKANSEN_PLANNED;
  const freeBudgetTotal = t.availableBudget - necessaryBudget;
  const otherSpent = entries.filter(e => e.type === "expense" && e.category === "other").reduce((s,e) => s+e.amount, 0);
  const freeRemaining = freeBudgetTotal - otherSpent;
  const freePct = Math.min(100, (otherSpent / freeBudgetTotal) * 100);

  document.getElementById("freeBudgetRemaining").textContent = formatYen(freeRemaining);
  document.getElementById("freeBudgetRemaining").style.color = freeRemaining < 0 ? "#B5542C" : "#D97757";
  document.getElementById("freeBudgetFill").style.width = Math.max(0, freePct) + "%";
  document.getElementById("freeBudgetFill").style.background = freePct > 90 ? "#B5542C" : "#D97757";
  document.getElementById("freeBudgetCaption").textContent =
    "扣除必要預算（餐費/地鐵/飲料/新幹線共 " + formatYen(necessaryBudget) + "）後可用 " + formatYen(freeBudgetTotal) + " · 已花 " + formatYen(otherSpent);
}

function renderCalendar() {
  const dateRange = getDateRange(START_DATE, END_DATE);
  const todayStr = new Date().toISOString().slice(0,10);
  if (!selectedCalDate) {
    selectedCalDate = dateRange.includes(todayStr) ? todayStr : dateRange[0];
  }

  // 月份標籤（用行程開始月份）
  const firstDate = new Date(START_DATE + "T00:00:00");
  document.getElementById("calMonthLabel").textContent = (firstDate.getFullYear()) + "年" + (firstDate.getMonth()+1) + "月";

  const monthExpenseTotal = entries.filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
  document.getElementById("calMonthTotal").textContent = "行程總支出 " + formatYen(monthExpenseTotal);

  // 建立月曆格子：以行程當月完整週為單位排列
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const weekdayLabels = ["日","一","二","三","四","五","六"];
  const gridEl = document.getElementById("calGrid");
  let cellsHtml = weekdayLabels.map(w => `<div class="cal-weekday">${w}</div>`).join("");

  for (let i = 0; i < startWeekday; i++) {
    cellsHtml += `<div class="cal-cell empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const inTrip = dateRange.includes(dateStr);
    const dayExpense = entries.filter(e => e.type === "expense" && e.date === dateStr).reduce((s,e)=>s+e.amount,0);
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalDate;
    const classes = ["cal-cell"];
    if (isToday) classes.push("today");
    if (isSelected) classes.push("selected");
    if (!inTrip) classes.push("empty");

    cellsHtml += `
      <div class="${classes.join(' ')}" ${inTrip ? `onclick="selectCalDate('${dateStr}')"` : ""}>
        <div class="cal-cell-day">${d}</div>
        ${dayExpense > 0 ? `<div class="cal-cell-amount">${formatYen(dayExpense)}</div>` : ""}
      </div>
    `;
  }

  gridEl.innerHTML = cellsHtml;

  // 選中日期的明細
  document.getElementById("calDayTitle").textContent = dayLabel(selectedCalDate);
  const dayEntries = entries.filter(e => e.date === selectedCalDate);
  const dayExpenseTotal = dayEntries.filter(e => e.type === "expense").reduce((s,e)=>s+e.amount,0);
  document.getElementById("calDayTotal").textContent = formatYen(dayExpenseTotal);

  const detailEl = document.getElementById("calDayEntries");
  if (dayEntries.length === 0) {
    detailEl.innerHTML = `<div class="empty-state" style="padding:16px;">這天還沒有紀錄</div>`;
  } else {
    const sorted = [...dayEntries].sort((a,b) => b.id.localeCompare(a.id));
    detailEl.innerHTML = `<div class="entry-list">` + sorted.map(e => {
      const isIncome = e.type === "income";
      const meta = isIncome ? INCOME_META : (CATEGORIES.find(c => c.key === e.category) || CATEGORIES[CATEGORIES.length-1]);
      return `
        <div class="entry-row">
          <div class="entry-icon-wrap" style="background:${meta.color}1A;">${meta.icon}</div>
          <div class="entry-mid">
            <div class="entry-note">${escapeHtml(e.note || meta.label)}</div>
            <div class="entry-sub">${isIncome ? "收入" : meta.label}</div>
          </div>
          <div class="entry-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatYen(e.amount)}</div>
        </div>
      `;
    }).join("") + `</div>`;
  }
}

function selectCalDate(dateStr) {
  selectedCalDate = dateStr;
  renderCalendar();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function openForm() {
  const dateSelect = document.getElementById("dateSelect");
  dateSelect.innerHTML = "";
  getDateRange(START_DATE, END_DATE).forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = dayLabel(d);
    dateSelect.appendChild(opt);
  });

  const today = new Date().toISOString().slice(0,10);
  if (today >= START_DATE && today <= END_DATE) dateSelect.value = today;

  selectedCategory = "food";
  setEntryType("expense");

  document.getElementById("amountInput").value = "";
  document.getElementById("noteInput").value = "";
  validateForm();

  document.getElementById("modalOverlay").classList.add("open");
  setTimeout(() => document.getElementById("amountInput").focus(), 50);
}

function closeForm() {
  document.getElementById("modalOverlay").classList.remove("open");
  render();
}
function closeFormIfOverlay(ev) {
  if (ev.target.id === "modalOverlay") closeForm();
}

function setEntryType(type) {
  selectedType = type;
  const expenseBtn = document.getElementById("toggleExpenseBtn");
  const incomeBtn = document.getElementById("toggleIncomeBtn");
  const catGroup = document.getElementById("catPickerGroup");
  const submitBtn = document.getElementById("submitBtn");
  const modalTitle = document.getElementById("modalTitle");

  if (type === "expense") {
    expenseBtn.classList.add("active-expense");
    incomeBtn.classList.remove("active-income");
    catGroup.style.display = "block";
    submitBtn.classList.remove("income-mode");
    modalTitle.textContent = "新增支出";
    renderCatPicker();
  } else {
    incomeBtn.classList.add("active-income");
    expenseBtn.classList.remove("active-expense");
    catGroup.style.display = "none";
    submitBtn.classList.add("income-mode");
    modalTitle.textContent = "新增收入";
  }
}

function renderCatPicker() {
  const picker = document.getElementById("catPicker");
  picker.innerHTML = "";
  CATEGORIES.forEach(c => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-picker-btn" + (selectedCategory === c.key ? " active" : "");
    btn.style.borderColor = selectedCategory === c.key ? c.color : "#E5DDD0";
    btn.style.background = selectedCategory === c.key ? c.color + "14" : "#FFFEFB";
    btn.style.color = selectedCategory === c.key ? c.color : "#8A7A63";
    btn.innerHTML = `<span>${c.icon}</span><span>${c.label}</span>`;
    btn.onclick = () => { selectedCategory = c.key; renderCatPicker(); };
    picker.appendChild(btn);
  });
}

function validateForm() {
  const amt = parseFloat(document.getElementById("amountInput").value);
  const btn = document.getElementById("submitBtn");
  if (amt && amt > 0) btn.classList.add("enabled");
  else btn.classList.remove("enabled");
}

function addEntry() {
  const amt = parseFloat(document.getElementById("amountInput").value);
  if (!amt || amt <= 0) return;
  const date = document.getElementById("dateSelect").value;
  const note = document.getElementById("noteInput").value.trim();

  const entry = {
    id: "e_" + Date.now(),
    type: selectedType,
    amount: amt,
    date: date,
    note: note,
  };
  if (selectedType === "expense") entry.category = selectedCategory;

  entries.push(entry);

  persist();
  closeForm();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  persist();
  render();
}

async function resetAllEntries() {
  if (!confirm("確定要清空所有紀錄嗎？此動作無法復原。")) return;
  entries = [];
  await persist();
  render();
}

loadEntries();
</script>
